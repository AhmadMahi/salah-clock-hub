name: Build and release firmware

# Tag a commit to publish a release the clocks will pick up automatically:
#   git tag v3.1.1 && git push origin v3.1.1
# Keep the tag in step with FW_VERSION in salah_clock.ino.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install "U8g2@2.36.19" "ArduinoJson@7.4.3" "ArduinoMqttClient@0.1.8"

      - name: Compile
        run: |
          # arduino-cli wants the folder name to match the sketch name
          mkdir -p sketch/salah_clock
          cp salah_clock.ino espnow_packet.h sketch/salah_clock/
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --output-dir out sketch/salah_clock
          cp out/salah_clock.ino.bin salah_clock_hub.bin
          ls -l salah_clock_hub.bin

      - name: Check the tag matches FW_VERSION
        run: |
          FW=$(grep -oE '#define FW_VERSION "[^"]+"' salah_clock.ino | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          echo "FW_VERSION=$FW  tag=$TAG"
          if [ "$FW" != "$TAG" ]; then
            echo "::error::FW_VERSION ($FW) does not match the tag ($TAG)"
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: salah_clock_hub.bin
          generate_release_notes: true
